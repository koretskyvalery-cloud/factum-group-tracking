name: Update dashboard

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        env:
          CSV_MONTHLY_URL: ${{ secrets.CSV_MONTHLY_URL }}
          CSV_B2B_URL: ${{ secrets.CSV_B2B_URL }}
        run: python build.py
      - name: Commit and push
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto-update data"
          git push

