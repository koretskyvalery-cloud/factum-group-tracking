<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Factum Auto · детальная аналитика</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface-1: #fcfcfb;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --border: rgba(11,11,11,0.10); --grid: #e1e0d9; --baseline: #c3c2b7;
    --series-1: #2a78d6; --series-1-lt: #86b6ef; --series-2: #eb6834; --series-3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --baseline: #383835;
      --series-1: #3987e5; --series-1-lt: #6da7ec; --series-2: #d95926; --series-3: #199e70;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page);
         color: var(--text-primary); min-height: 100vh; padding: 24px 24px 40px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .back { font-size: 13px; color: var(--series-1); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  h1 { font-size: 22px; font-weight: 700; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--series-1); flex: none; }
  .sub { margin: 6px 0 18px; font-size: 13px; color: var(--text-secondary); }
  h2 { font-size: 15px; font-weight: 650; margin: 20px 0 10px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
          padding: 16px 18px 14px; margin-bottom: 12px; }
  .depts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 760px) { .depts { grid-template-columns: 1fr; } }
  a.dept { display: block; text-decoration: none; color: inherit; background: var(--surface-1);
           border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 12px;
           transition: border-color .12s ease; }
  a.dept:hover { border-color: var(--series-1); }
  .dept-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dept-name { font-size: 14px; font-weight: 650; }
  .arrow { color: var(--series-1); font-weight: 600; font-size: 13px; }
  .dept-mini { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .mini { min-width: 70px; }
  .mini-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .mini-value { font-size: 22px; font-weight: 650; line-height: 1.1; }
  .mini-value .u { font-size: 12px; font-weight: 400; color: var(--text-muted); }
  .demo-badge { font-size: 10px; font-weight: 600; color: var(--text-muted);
                border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
  .metrics { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 10px; }
  .metric { min-width: 130px; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
  .metric-value { font-size: 30px; line-height: 1.05; font-weight: 600; }
  .metric-note { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .chart-title { font-size: 12px; color: var(--text-muted); margin: 4px 0 6px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .note { font-size: 13px; color: var(--text-secondary); margin-top: 10px; line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Factum Group Tracking</a>
  <h1><span class="dot"></span>Factum Auto · детальная аналитика</h1>
  <div class="sub" id="sub">Импорт авто под заказ</div>

  <h2>Отделы</h2>
  <div class="depts">
    <a class="dept" href="factum-auto-hr.html">
      <div class="dept-head"><span class="dept-name">HR-отдел</span><span class="arrow">→</span></div>
      <div class="dept-mini">
        <div class="mini"><div class="mini-label">Активных менеджеров</div><div class="mini-value" id="hr-mgr">—</div></div>
        <div class="mini"><div class="mini-label">Вакансии</div><div class="mini-value">4 <span class="demo-badge">демо</span></div></div>
      </div>
    </a>
    <a class="dept" href="factum-auto-marketing.html">
      <div class="dept-head"><span class="dept-name">Маркетинг</span><span class="arrow">→</span></div>
      <div class="dept-mini">
        <div class="mini"><div class="mini-label">Лиды за месяц</div><div class="mini-value" id="mk-leads">—</div></div>
        <div class="mini"><div class="mini-label">CR в депозит</div><div class="mini-value" id="mk-cr">—</div></div>
      </div>
    </a>
    <a class="dept" href="factum-auto-sales.html">
      <div class="dept-head"><span class="dept-name">Отдел продаж</span><span class="arrow">→</span></div>
      <div class="dept-mini">
        <div class="mini"><div class="mini-label">Покупки</div><div class="mini-value" id="sd-buy">—</div></div>
        <div class="mini"><div class="mini-label">Депозиты (чистые)</div><div class="mini-value" id="sd-net">—</div></div>
      </div>
    </a>
  </div>

</div>
<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const SHEET_ID = '10sbvUaWDkrJJqIC7ciuSsci21GuRMUV5P2TBhZCTF8U';
const MONTH_NUM = {'Январь':1,'Февраль':2,'Март':3,'Апрель':4,'Май':5,'Июнь':6,'Июль':7,'Август':8,'Сентябрь':9,'Октябрь':10,'Ноябрь':11,'Декабрь':12};
const MONTH_ABBR = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
function gvRows(t) { return (t.table.rows||[]).map(r => (r.c||[]).map(c => (c && c.v != null) ? c.v : '')); }
function num(v) {
  if (typeof v === 'number') return Math.round(v);
  const s = String(v).trim().replace(/\s/g,'').replace(',', '.');
  if (!s) return null;
  const f = parseFloat(s);
  return isNaN(f) ? null : Math.round(f);
}
function pct(v) {
  let f = null;
  if (typeof v === 'number') f = v < 1 ? v * 100 : v;
  else { const s = String(v).replace(',', '.').replace('%','').trim(); if (s) f = parseFloat(s); }
  return (f == null || isNaN(f)) ? null : Math.round(f * 10) / 10;
}
function monthOf(l) { for (const n in MONTH_NUM) if (String(l).startsWith(n)) return MONTH_NUM[n]; return null; }
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function columns(labels, vals, color) {
  const W = 900, H = 170, padT = 22, padB = 18, padX = 6;
  const plotH = H - padT - padB, baseY = padT + plotH;
  const n = labels.length, groupW = (W - padX*2) / n;
  const barW = Math.min(26, groupW - 16);
  const nums = vals.filter(v => typeof v === 'number');
  const maxV = nums.length ? Math.max(...nums) : 1;
  let out = `<line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--baseline)" stroke-width="1"/>`;
  for (let i = 0; i < n; i++) {
    const v = vals[i], gx = padX + i * groupW, x = gx + (groupW - barW) / 2;
    if (typeof v === 'number') {
      const h = Math.max(2, v / maxV * plotH), y = baseY - h;
      out += `<path d="${barPath(x, y, barW, h, 4)}" fill="${color}"/>`;
      out += `<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${v}</text>`;
    }
    out += `<text x="${gx+groupW/2}" y="${baseY+14}" text-anchor="middle" font-size="11" ${i===n-1?'font-weight="650"':''} fill="var(--text-muted)">${esc(labels[i])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}
function groupedColumns(labels, seriesArr) {
  const W = 900, H = 190, padT = 22, padB = 18, padX = 6;
  const plotH = H - padT - padB, baseY = padT + plotH;
  const n = labels.length, nSer = seriesArr.length;
  const groupW = (W - padX*2) / n;
  const barW = Math.min(26, (groupW - 20 - (nSer-1)*2) / nSer);
  const nums = seriesArr.flatMap(s => s.vals).filter(v => typeof v === 'number');
  const maxV = nums.length ? Math.max(...nums) : 1;
  let out = `<line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--baseline)" stroke-width="1"/>`;
  for (let i = 0; i < n; i++) {
    const gx = padX + i * groupW;
    const total = nSer * barW + (nSer-1)*2;
    const start = gx + (groupW - total) / 2;
    for (let s = 0; s < nSer; s++) {
      const v = seriesArr[s].vals[i];
      if (typeof v !== 'number') continue;
      const h = Math.max(2, v / maxV * plotH), x = start + s*(barW+2), y = baseY - h;
      out += `<path d="${barPath(x, y, barW, h, 4)}" fill="${seriesArr[s].color}"/>`;
      out += `<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${v}</text>`;
    }
    out += `<text x="${gx+groupW/2}" y="${baseY+14}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${esc(labels[i])}</text>`;
  }
  const legend = seriesArr.map(s =>
    `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px;color:var(--text-secondary)"><span style="width:10px;height:10px;border-radius:3px;background:${s.color}"></span>${esc(s.label)}</span>`).join('');
  return `<div style="margin-bottom:6px">${legend}</div><svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}
// разбор Лист1: факт-показатели по месяцам 2026
function parseFacts(rows) {
  const F = { mgr:{}, leads:{}, dep:{}, net:{}, buy:{}, crDep:{}, crBuy:{} };
  let cur = null;
  for (const row of rows) {
    const a = String(row[0]||'').trim();
    if (a && a.indexOf('2026') > -1) { const m = monthOf(a); cur = (m && a.indexOf('Факт') > -1) ? m : null; }
    if (!cur) continue;
    const crit = String(row[1]||'').trim();
    if (crit.startsWith('Менеджеры с деп')) F.mgr[cur] = num(row[2]);
    else if (crit === 'Лиды') F.leads[cur] = num(row[2]);
    else if (crit.startsWith('Депозиты Факт')) F.net[cur] = num(row[2]);
    else if (crit === 'Депозиты') F.dep[cur] = num(row[2]);
    else if (crit === 'Покупки') F.buy[cur] = num(row[2]);
    else if (crit.startsWith('CR из лида в деп')) F.crDep[cur] = pct(row[2]);
    else if (crit.startsWith('CR из лида в пок')) F.crBuy[cur] = pct(row[2]);
  }
  return F;
}
function series(map, cm) { const r=[]; for (let m=1;m<=cm;m++) r.push(map[m] ?? null); return r; }
function gvLoad(sheet, handler, range) {
  const s = document.createElement('script');
  s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=responseHandler:' + handler +
          '&sheet=' + encodeURIComponent(sheet) + '&range=' + (range || 'A1:C300') + '&headers=0&t=' + Date.now();
  document.body.appendChild(s);
}
function stampSub(prefix) {
  const now = new Date();
  const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('sub').textContent = prefix + ' · данные из таблицы, загружено в ' + t;
}


window.__gvM = t => {
  try {
    const F = parseFacts(gvRows(t));
    const cm = new Date().getMonth() + 1;
    if (F.mgr[cm] != null) document.getElementById('hr-mgr').textContent = F.mgr[cm];
    if (F.leads[cm] != null) document.getElementById('mk-leads').textContent = F.leads[cm];
    if (F.crDep[cm] != null) document.getElementById('mk-cr').textContent = String(F.crDep[cm]).replace('.', ',') + '%';
    // покупки показываем из «Общий зачет» (__gvS); Лист1 — только фолбэк
    if (window.SPER == null && F.buy[cm] != null) document.getElementById('sd-buy').textContent = F.buy[cm];
    if (F.net[cm] != null) document.getElementById('sd-net').textContent = F.net[cm];
    stampSub('Импорт авто под заказ');
  } catch (e) { console.log(e); }
};
window.__gvS = t => {
  try {
    // покупки — из «Общий зачет» (Лист3): там они отражаются вовремя
    const per = {};
    gvRows(t).forEach(r => { const y = Number(r[0]); if (y) per[y] = r.slice(1, 13).map(num); });
    const sp = per[new Date().getFullYear()];
    const cm = new Date().getMonth() + 1;
    if (sp && typeof sp[cm - 1] === 'number') {
      window.SPER = per;
      document.getElementById('sd-buy').textContent = sp[cm - 1];
    }
  } catch (e) { console.log(e); }
};
gvLoad('Лист1', '__gvM');
gvLoad('Лист3', '__gvS', 'A1:M10');
</script>
</body>
</html>
