<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factum Group Tracking</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:         rgba(11,11,11,0.10);
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --series-1:       #2a78d6;  /* Factum Auto — покупки */
    --series-1-lt:    #86b6ef;  /* Factum Auto — депозиты (ordinal, ступень светлее) */
    --series-2:       #eb6834;  /* Operator-EX */
    --series-3:       #1baf7a;  /* СТО */
    --series-4:       #eda100;  /* Factum Auto Dealer */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:         rgba(255,255,255,0.10);
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --series-1:       #3987e5;
      --series-1-lt:    #6da7ec;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --series-1:       #3987e5;
    --series-1-lt:    #6da7ec;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px 24px 32px;
  }

  .wrap { max-width: 1060px; margin: 0 auto; }

  header {
    margin-bottom: 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .kicker {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }

  .sub { margin-top: 6px; font-size: 13px; color: var(--text-secondary); }

  /* Общий блок: прогресс календарного месяца */
  .month-progress {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 250px;
  }
  .month-progress .mp-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .mp-row { display: flex; align-items: center; gap: 12px; }
  .mp-pct { font-size: 22px; font-weight: 650; }
  .mp-days { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px 12px;
  }

  .card-head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .proj-name { font-size: 15px; font-weight: 650; }
  .proj-desc { font-size: 12px; color: var(--text-muted); margin: 1px 0 12px; }

  .demo-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
  }

  .metrics { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 10px; }
  .metric { min-width: 150px; flex: 1 1 150px; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
  .metric-value { font-size: 32px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em; }
  .metric-value .of-plan { font-size: 15px; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }

  /* Шкала выполнения плана */
  .plan-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .meter {
    flex: 1 1 auto;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .meter .meter-fill {
    position: absolute; inset: 0 auto 0 0;
    border-radius: 4px;
    min-width: 2px;
  }
  .plan-pct { font-size: 13px; font-weight: 650; min-width: 44px; text-align: right; }
  .plan-note { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

  .no-plan { font-size: 12px; color: var(--text-muted); margin-top: 9px; }

  /* График (свёрнут по умолчанию, раскрывается стрелочкой) */
  .chart-block { border-top: 1px solid var(--grid); margin-top: 4px; }
  .chart-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: none; border: none; cursor: pointer;
    padding: 9px 0 7px;
    font: inherit; font-size: 12px; color: var(--text-secondary);
  }
  .chart-toggle:hover { color: var(--text-primary); }
  .chev { transition: transform 0.15s ease; color: var(--text-muted); font-size: 11px; }
  .chart-open .chev { transform: rotate(180deg); }
  .chart-wrap { padding-bottom: 4px; }
  .chart-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 6px; flex-wrap: wrap;
  }
  .chart-title { font-size: 12px; color: var(--text-muted); }

  .chart-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .chart-tab {
    font: inherit; font-size: 12px; cursor: pointer;
    padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border);
    background: none; color: var(--text-secondary);
  }
  .chart-tab.active {
    background: color-mix(in srgb, var(--series-1) 14%, var(--surface-1));
    border-color: color-mix(in srgb, var(--series-1) 40%, var(--surface-1));
    color: var(--text-primary); font-weight: 600;
  }

  .detail-link {
    margin-left: auto;
    font-size: 12px; font-weight: 600;
    color: var(--series-1); text-decoration: none;
    white-space: nowrap;
  }
  .detail-link:hover { text-decoration: underline; }
  .legend { display: flex; gap: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Factum Group</div>
      <h1>Factum Group Tracking</h1>
      <div class="sub" id="sub">Август 2026 · главные метрики месяца по проектам · данные на 08.08.2026 20:48 (Киев)</div>
    </div>
    <div class="month-progress">
      <div class="mp-label">Прогресс месяца (рабочие дни)</div>
      <div class="mp-row">
        <span class="mp-pct" id="mp-pct">—</span>
        <div class="meter" style="flex:1; background: var(--grid);">
          <span class="meter-fill" id="mp-fill" style="background: var(--text-muted); width: 0%;"></span>
        </div>
      </div>
      <div class="mp-days" id="mp-days"></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
// ---------- данные (снимок из Google-таблицы «Менеджеры отчет», 4 августа 2026) ----------
const MONTHS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг'];

const PROJECTS = [{"name": "Factum Auto", "desc": "Импорт авто под заказ", "demo": false, "span2": true, "color": "var(--series-1)", "metrics": [{"label": "Депозиты (чистые)", "fact": 34, "plan": 195, "planNote": "план по чистым депозитам: 195 · всего внесено: 41", "series": [149, 161, 166, 189, 171, 194, 186, 34], "color": "var(--series-1-lt)"}, {"label": "Покупки", "fact": 22, "plan": 195, "series": [140, 144, 179, 186, 187, 166, 175, 22], "color": "var(--series-1)"}], "chartTitle": "Факт по месяцам, 2026 (текущий месяц — идёт)", "months": ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг"]}, {"name": "Operator-EX", "desc": "Экспорт и продажи дилерам", "demo": false, "span2": false, "color": "var(--series-2)", "metrics": [{"label": "Куплено авто дилерами", "fact": 6, "plan": null, "series": [42, 17, 6], "color": "var(--series-2)"}], "chartTitle": "Факт по месяцам (аналитика ведётся с июня; текущий — идёт)", "months": ["Июн", "Июл", "Авг"]}, {"name": "СТО", "desc": "Кузовной ремонт и покраска", "demo": true, "span2": false, "color": "var(--series-3)", "metrics": [{"label": "Выдано авто в текущем месяце", "fact": 9, "plan": 12, "series": [6, 7, 7, 8, 8, 9, 8, 9], "color": "var(--series-3)"}], "chartTitle": "Факт по месяцам, 2026 (демо)", "months": ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг"]}, {"name": "Factum Auto Dealer", "desc": "Продажа авто в наличии", "demo": true, "span2": false, "metrics": [{"label": "Продано авто", "fact": 12, "plan": 15, "series": [10, 11, 13, 12, 14, 13, 14, 12], "color": "var(--series-4)"}], "color": "var(--series-4)", "chartTitle": "Факт по месяцам, 2026 (демо)", "months": ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг"]}];

// ---------- прогресс месяца по рабочим дням, пн–пт (считается на дату открытия) ----------
(function () {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const dim = new Date(y, m + 1, 0).getDate();
  let total = 0, elapsed = 0;
  for (let d = 1; d <= dim; d++) {
    const dow = new Date(y, m, d).getDay();
    if (dow >= 1 && dow <= 5) {
      total++;
      if (d <= now.getDate()) elapsed++;
    }
  }
  const pct = total ? Math.round(elapsed / total * 100) : 0;
  const todayIsWorkday = now.getDay() >= 1 && now.getDay() <= 5;
  document.getElementById('mp-pct').textContent = pct + '%';
  document.getElementById('mp-fill').style.width = pct + '%';
  document.getElementById('mp-days').textContent = todayIsWorkday
    ? elapsed + '-й рабочий день из ' + total
    : elapsed + ' из ' + total + ' рабочих дней прошло (выходной)';
})();

// ---------- рендер ----------
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function barPath(x, y, w, h, r) {
  // скругление 4px только сверху, у базовой линии — прямые углы
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}

function renderChart(p) {
  const W = 440, H = 150, padT = 20, padB = 18, padX = 6;
  const plotH = H - padT - padB;
  const baseY = padT + plotH;
  const nGroups = p.months.length;
  const series = p.metrics.filter(m => m.series);
  const nSer = series.length;
  const maxV = Math.max(...series.flatMap(m => m.series));
  const groupW = (W - padX * 2) / nGroups;
  const barW = Math.min(24, (groupW - 14 - (nSer - 1) * 2) / nSer);
  let out = '';
  // базовая линия
  out += `<line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--baseline)" stroke-width="1"/>`;
  for (let g = 0; g < nGroups; g++) {
    const gx = padX + g * groupW;
    const totalBars = nSer * barW + (nSer - 1) * 2;
    const start = gx + (groupW - totalBars) / 2;
    for (let s = 0; s < nSer; s++) {
      const v = series[s].series[g];
      if (v == null) continue;
      const h = Math.max(2, v / maxV * plotH);
      const x = start + s * (barW + 2);
      const y = baseY - h;
      out += `<path d="${barPath(x, y, barW, h, 4)}" fill="${series[s].color}"/>`;
      out += `<text x="${x + barW / 2}" y="${y - 5}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${v}</text>`;
    }
    // подпись месяца; текущий (последний) — жирнее
    const isLast = g === nGroups - 1;
    out += `<text x="${gx + groupW / 2}" y="${baseY + 15}" text-anchor="middle" font-size="11" ${isLast ? 'font-weight="650"' : ''} fill="var(--text-muted)">${p.months[g]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.chartTitle)}">${out}</svg>`;
}

function renderMetric(m, projColor) {
  let planHtml;
  if (m.plan != null) {
    const factForPlan = (m.planFact != null) ? m.planFact : m.fact;
    const pct = Math.round(factForPlan / m.plan * 100);
    const note = m.planNote || `план на текущий месяц: ${m.plan}`;
    planHtml = `
      <div class="plan-row">
        <div class="meter" style="background: color-mix(in srgb, ${m.color} 18%, var(--surface-1));">
          <span class="meter-fill" style="background: ${m.color}; width: ${Math.min(100, pct)}%;"></span>
        </div>
        <span class="plan-pct">${pct}%</span>
      </div>
      <div class="plan-note">${esc(note)}</div>`;
  } else {
    planHtml = `<div class="no-plan">план в таблице не задан</div>`;
  }
  return `
    <div class="metric">
      <div class="metric-label">${esc(m.label)}</div>
      <div class="metric-value">${m.fact}</div>
      ${planHtml}
    </div>`;
}

const openCharts = new Set(); // какие карточки развёрнуты — переживает live-перерисовку
const chartTab = {};          // выбранная вкладка графика по имени проекта
let currentProjects = null;   // последний отрисованный набор данных

// хронология продаж: среднее купленных авто за месяц, по кварталам, 2025 vs 2026
// (источник — «Общий зачет 2025/2026»); фолбэк-снимок, при загрузке живых данных пересчитывается
let SALES_QUARTERS = {
  labels: ['К1', 'К2', 'К3', 'К4'],
  years: { 2025: [108, 133, 172, 146], 2026: [155, 180, 176, null] },
  note: '* К3 2026 не завершён — среднее по закрытым месяцам',
};

function quarterTable(rows, now) {
  const per = {};
  rows.forEach(r => { const y = Number(r[0]); if (y) per[y] = r.slice(1, 13); });
  const curY = now.getFullYear(), curM = now.getMonth() + 1;
  const out = { labels: ['К1', 'К2', 'К3', 'К4'], years: {}, note: '' };
  Object.keys(per).map(Number).sort().forEach(y => {
    const vals = [];
    for (let q = 0; q < 4; q++) {
      const ms = [q * 3 + 1, q * 3 + 2, q * 3 + 3];
      const use = ms.filter(m => y < curY || (y === curY && m < curM))
                    .map(m => per[y][m - 1]).filter(v => typeof v === 'number');
      if (!use.length) { vals.push(null); continue; }
      if (y === curY && ms.some(m => m >= curM))
        out.note = '* К' + (q + 1) + ' ' + y + ' не завершён — среднее по закрытым месяцам';
      vals.push(Math.round(use.reduce((a, b) => a + b, 0) / use.length));
    }
    out.years[y] = vals;
  });
  return out;
}

function renderCard(p) {
  const legend = p.metrics.length > 1
    ? `<div class="legend">${p.metrics.map(m =>
        `<div class="legend-item"><span class="swatch" style="background:${m.color}"></span>${esc(m.label)}</div>`).join('')}</div>`
    : '';
  const open = openCharts.has(p.name);
  const hasAlt = p.name === 'Factum Auto';
  const mode = hasAlt ? (chartTab[p.name] || 'months') : 'months';
  let chartHtml, chartTitle = p.chartTitle, legendHtml = legend;
  if (mode === 'quarters') {
    const ys = Object.keys(SALES_QUARTERS.years).sort();
    const qMetrics = ys.map((y, i) => ({
      label: y,
      series: SALES_QUARTERS.years[y],
      color: i === ys.length - 1 ? 'var(--series-1)' : 'var(--series-1-lt)',
    }));
    chartHtml = renderChart({ metrics: qMetrics, months: SALES_QUARTERS.labels, chartTitle: 'Хронология продаж' });
    chartTitle = 'Среднее купленных авто за месяц' + (SALES_QUARTERS.note ? ' · ' + SALES_QUARTERS.note : '');
    legendHtml = `<div class="legend">${qMetrics.map(m =>
      `<div class="legend-item"><span class="swatch" style="background:${m.color}"></span>${esc(m.label)}</div>`).join('')}</div>`;
  } else {
    chartHtml = renderChart(p);
  }
  const tabs = hasAlt ? `
        <div class="chart-tabs">
          <button class="chart-tab${mode === 'months' ? ' active' : ''}" type="button" data-mode="months">По месяцам</button>
          <button class="chart-tab${mode === 'quarters' ? ' active' : ''}" type="button" data-mode="quarters">Хронология продаж</button>
        </div>` : '';
  return `
    <section class="card">
      <div class="card-head">
        <span class="dot" style="background:${p.color}"></span>
        <span class="proj-name">${esc(p.name)}</span>
        ${p.demo ? '<span class="demo-badge">демо-данные</span>' : ''}
        ${hasAlt ? '<a class="detail-link" href="factum-auto.html">Детальная аналитика →</a>' : ''}
      </div>
      <div class="proj-desc">${esc(p.desc)}</div>
      <div class="metrics">${p.metrics.map(m => renderMetric(m, p.color)).join('')}</div>
      <div class="chart-block${open ? ' chart-open' : ''}" data-proj="${esc(p.name)}">
        <button class="chart-toggle" type="button" aria-expanded="${open}">
          <span>Динамика</span><span class="chev">▼</span>
        </button>
        <div class="chart-wrap" ${open ? '' : 'hidden'}>
          ${tabs}
          <div class="chart-head">
            <span class="chart-title">${esc(chartTitle)}</span>
            ${legendHtml}
          </div>
          <div class="chart">${chartHtml}</div>
        </div>
      </div>
    </section>`;
}

document.getElementById('grid').addEventListener('click', e => {
  const tab = e.target.closest('.chart-tab');
  if (tab) {
    const name = tab.closest('.chart-block').getAttribute('data-proj');
    chartTab[name] = tab.getAttribute('data-mode');
    if (currentProjects) renderAll(currentProjects);
    return;
  }
  const btn = e.target.closest('.chart-toggle');
  if (!btn) return;
  const block = btn.closest('.chart-block');
  const name = block.getAttribute('data-proj');
  const wrap = block.querySelector('.chart-wrap');
  const nowOpen = wrap.hidden;
  wrap.hidden = !nowOpen;
  block.classList.toggle('chart-open', nowOpen);
  btn.setAttribute('aria-expanded', String(nowOpen));
  if (nowOpen) openCharts.add(name); else openCharts.delete(name);
});

function renderAll(projects) {
  currentProjects = projects;
  document.getElementById('grid').innerHTML = projects.map(renderCard).join('');
}
renderAll(PROJECTS); // сборка на момент публикации — фолбэк, если живые данные не загрузятся

// ---------- живые данные напрямую из таблицы-прослойки (gviz, работает с любого домена) ----------
const SHEET_ID = '10sbvUaWDkrJJqIC7ciuSsci21GuRMUV5P2TBhZCTF8U';
const MONTH_NUM = {'Январь':1,'Февраль':2,'Март':3,'Апрель':4,'Май':5,'Июнь':6,'Июль':7,'Август':8,'Сентябрь':9,'Октябрь':10,'Ноябрь':11,'Декабрь':12};
const MONTH_ABBR = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MONTH_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function gvRows(tbl) {
  return (tbl.table.rows || []).map(r => (r.c || []).map(c => (c && c.v != null) ? c.v : ''));
}
function num(v) {
  if (typeof v === 'number') return Math.round(v);
  const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (!s) return null;
  const f = parseFloat(s);
  return isNaN(f) ? null : Math.round(f);
}
function monthOf(label) {
  for (const name in MONTH_NUM) if (String(label).startsWith(name)) return MONTH_NUM[name];
  return null;
}
function parseMonthly(rows) {
  const out = {};
  let cur = null;
  for (const row of rows) {
    const a = String(row[0] || '').trim();
    if (a && a.indexOf('2026') > -1) {
      const kind = a.indexOf('Факт') > -1 ? 'fact' : (a.indexOf('План') > -1 ? 'plan' : null);
      const m = monthOf(a);
      cur = (kind && m) ? kind + '|' + m : null;
    }
    if (!cur) continue;
    const crit = String(row[1] || '').trim();
    if (crit.startsWith('Депозиты Факт')) out[cur + '|net'] = num(row[2]);
    else if (crit === 'Депозиты') out[cur + '|dep'] = num(row[2]);
    else if (crit === 'Покупки') out[cur + '|buy'] = num(row[2]);
  }
  return out;
}
function parseB2B(rows) {
  const out = {};
  let cur = null;
  for (const row of rows) {
    const a = String(row[0] || '').trim();
    if (a) { const m = monthOf(a); cur = (m && a.indexOf('Факт') > -1) ? m : null; }
    if (cur && String(row[1] || '').trim() === 'Покупки') out[cur] = num(row[2]);
  }
  return out;
}
function buildProjects(monthly, b2b, now) {
  const cm = now.getMonth() + 1;
  const months = MONTH_ABBR.slice(0, cm);
  const s = (key) => { const r = []; for (let m = 1; m <= cm; m++) r.push(monthly['fact|' + m + '|' + key]); return r; };
  const depFact = monthly['fact|' + cm + '|dep'] || 0;
  const buyFact = monthly['fact|' + cm + '|buy'] || 0;
  const buyPlan = monthly['plan|' + cm + '|buy'] ?? null;
  const netFact = monthly['fact|' + cm + '|net'] || 0;
  const netPlan = monthly['plan|' + cm + '|net'] ?? null;
  const bMonths = Object.keys(b2b).map(Number).sort((a, b) => a - b);
  return [
    { name: 'Factum Auto', desc: 'Импорт авто под заказ', demo: false, span2: true, color: 'var(--series-1)',
      metrics: [
        { label: 'Депозиты (чистые)', fact: netFact, plan: netPlan,
          planNote: netPlan ? ('план по чистым депозитам: ' + netPlan + ' · всего внесено: ' + depFact) : null,
          series: s('net'), color: 'var(--series-1-lt)' },
        { label: 'Покупки', fact: buyFact, plan: buyPlan, series: s('buy'), color: 'var(--series-1)' },
      ],
      chartTitle: 'Факт по месяцам, 2026 (текущий месяц — идёт)', months: months },
    { name: 'Operator-EX', desc: 'Экспорт и продажи дилерам', demo: false, span2: false, color: 'var(--series-2)',
      metrics: [
        { label: 'Куплено авто дилерами', fact: b2b[cm] || 0, plan: null, series: bMonths.map(m => b2b[m]), color: 'var(--series-2)' },
      ],
      chartTitle: 'Факт по месяцам (аналитика ведётся с июня; текущий — идёт)', months: bMonths.map(m => MONTH_ABBR[m - 1]) },
    { name: 'СТО', desc: 'Кузовной ремонт и покраска', demo: true, span2: false, color: 'var(--series-3)',
      metrics: [{ label: 'Выдано авто в текущем месяце', fact: 9, plan: 12, series: [6,7,7,8,8,9,8,9], color: 'var(--series-3)' }],
      chartTitle: 'Факт по месяцам, 2026 (демо)', months: MONTH_ABBR.slice(0, 8) },
    { name: 'Factum Auto Dealer', desc: 'Продажа авто в наличии', demo: true, span2: false, color: 'var(--series-4)',
      metrics: [{ label: 'Продано авто', fact: 12, plan: 15, series: [10,11,13,12,14,13,14,12], color: 'var(--series-4)' }],
      chartTitle: 'Факт по месяцам, 2026 (демо)', months: MONTH_ABBR.slice(0, 8) },
  ];
}

const gvResults = {};
window.__gvM = t => { gvResults.m = t; gvTryRender(); };
window.__gvB = t => { gvResults.b = t; gvTryRender(); };
window.__gvS = t => {
  try {
    const q = quarterTable(gvRows(t), new Date());
    if (Object.keys(q.years).length) SALES_QUARTERS = q;
  } catch (e) { console.log('sales history error:', e); }
  gvTryRender();
};
function gvTryRender() {
  if (!gvResults.m || !gvResults.b) return;
  try {
    const now = new Date();
    renderAll(buildProjects(parseMonthly(gvRows(gvResults.m)), parseB2B(gvRows(gvResults.b)), now));
    const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    document.getElementById('sub').textContent =
      MONTH_FULL[now.getMonth()] + ' ' + now.getFullYear() +
      ' · главные метрики месяца по проектам · данные из таблицы, загружено в ' + t;
  } catch (e) { console.log('live data error:', e); }
}
function gvLoad(sheet, handler, range) {
  const s = document.createElement('script');
  s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=responseHandler:' + handler +
          '&sheet=' + encodeURIComponent(sheet) + '&range=' + (range || 'A1:C300') + '&headers=0&t=' + Date.now();
  s.onerror = () => console.log('live data unavailable: ' + sheet);
  document.body.appendChild(s);
}
gvLoad('Лист1', '__gvM');
gvLoad('Лист2', '__gvB');
gvLoad('Лист3', '__gvS', 'A1:M10');
</script>
